<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><title>Page not found | PHY tools</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090a0c;color:#eef5fc;font:16px system-ui;text-align:center}.card{padding:30px;border:1px solid #ffffff25;border-radius:18px;background:#171d25;max-width:420px;margin:18px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button,a{border:1px solid #ffffff30;border-radius:9px;padding:10px 14px;background:#1b2939;color:#dcebfa;text-decoration:none;cursor:pointer}</style></head><body><main class="card"><h1>PHY tools</h1><h2 id="heading">Page not found</h2><p id="bodyText">The requested page does not exist.</p><div class="actions"><a id="home" href="./index.html">Return to all Physics Simulations</a><button id="language" type="button">සිංහල</button></div></main><script>let lang='en';try{lang=localStorage.getItem('phy-lang')==='si'?'si':'en'}catch(e){}const apply=()=>{document.documentElement.lang=lang;document.title=lang==='si'?'පිටුව හමු නොවීය | PHY tools':'Page not found | PHY tools';document.getElementById('heading').textContent=lang==='si'?'අදාළ පිටුව හමු නොවීය':'Page not found';document.getElementById('bodyText').textContent=lang==='si'?'ඔබ ඉල්ලා සිටි පිටුව මෙහි නොමැත.':'The requested page does not exist.';document.getElementById('home').textContent=lang==='si'?'භෞතික විද්‍යා මෙවලම් වෙත ආපසු යන්න':'Return to all Physics Simulations';document.getElementById('language').textContent=lang==='si'?'English':'සිංහල'};apply();document.getElementById('language').addEventListener('click',()=>{lang=lang==='en'?'si':'en';try{localStorage.setItem('phy-lang',lang)}catch(e){}apply()});</script></body></html>
